
services:
  payload:
    image: payl:latest
    user: 1001:1001
    ports:
      - "8080:8080"
    volumes:
      # Bind a writable data directory into the container; SQLite DB lives under /app/data
      - ./data:/app/data:rw
    environment:
      - PORT=8080
      - HOSTNAME=0.0.0.0
      - DATABASE_URI=file:/app/data/payloads.db
    env_file:
      - .env
